name: OwnerPlot monitor

on:
  schedule:
    - cron: "27 * * * *"
  workflow_dispatch:
    inputs:
      locality:
        description: Optional single Coimbatore locality
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: ownerplot-state
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      ALLOWED_PUBLIC_DOMAINS: ${{ vars.ALLOWED_PUBLIC_DOMAINS }}
      SCAN_BATCH_SIZE: ${{ vars.SCAN_BATCH_SIZE || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Scan public owner listings
        shell: bash
        run: |
          if [ -n "${{ inputs.locality }}" ]; then
            python -m ownerplot.github_runner scan --locality "${{ inputs.locality }}" --report
          else
            python -m ownerplot.github_runner scan
          fi
      - name: Save discovery state
        run: |
          if git diff --quiet -- data/state.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git commit -m "chore: update property discovery state"
          git push

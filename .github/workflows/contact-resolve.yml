name: OwnerPlot contact resolver

on:
  push:
    branches:
      - feature/public-owner-contact-resolver
    paths:
      - "src/ownerplot/contact_resolver.py"
      - "src/ownerplot/contact_scan.py"
      - "src/ownerplot/portal_seeds.py"
      - ".github/workflows/contact-resolve.yml"
      - "config/allowed-public-domains.txt"
  workflow_dispatch:
    inputs:
      locality:
        description: Coimbatore locality to deep-search
        required: false
        default: Kalapatti
        type: string
  schedule:
    - cron: "45 2 * * *"

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GOOGLE_CSE_API_KEY: ${{ secrets.GOOGLE_CSE_API_KEY }}
      GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      FACEBOOK_PAGE_IDS: ${{ vars.FACEBOOK_PAGE_IDS }}
      META_GRAPH_API_VERSION: ${{ vars.META_GRAPH_API_VERSION || 'v26.0' }}
      CONTACT_STORE_KEY: ${{ secrets.CONTACT_STORE_KEY }}
      ALLOWED_PUBLIC_DOMAINS: ${{ vars.ALLOWED_PUBLIC_DOMAINS }}
      PUBLIC_CONTACT_RESOLVE_MAX_LISTINGS: ${{ vars.PUBLIC_CONTACT_RESOLVE_MAX_LISTINGS || '8' }}
      PUBLIC_CONTACT_RESOLVE_QUERIES: ${{ vars.PUBLIC_CONTACT_RESOLVE_QUERIES || '8' }}
      PUBLIC_CONTACT_MIN_MATCH_SCORE: ${{ vars.PUBLIC_CONTACT_MIN_MATCH_SCORE || '75' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -e .
      - name: Resolve public owner contacts
        shell: bash
        run: |
          LOCALITY="${{ inputs.locality }}"
          if [ -z "$LOCALITY" ]; then LOCALITY="Kalapatti"; fi
          python -m ownerplot.contact_scan --locality "$LOCALITY" --telegram

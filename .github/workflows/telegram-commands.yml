name: Telegram commands

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/telegram-commands.yml
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ownerplot-state
  cancel-in-progress: false

jobs:
  commands:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      FACEBOOK_PAGE_IDS: ${{ vars.FACEBOOK_PAGE_IDS }}
      META_GRAPH_API_VERSION: ${{ vars.META_GRAPH_API_VERSION || 'v26.0' }}
      CONTACT_STORE_KEY: ${{ secrets.CONTACT_STORE_KEY }}
      PORTAL_CONTACT_MONTHLY_BUDGET: ${{ vars.PORTAL_CONTACT_MONTHLY_BUDGET || '25' }}
      ALLOWED_PUBLIC_DOMAINS: ${{ vars.ALLOWED_PUBLIC_DOMAINS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install public-image OCR
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr
      - run: pip install -e .
      - name: Run Telegram command worker or smoke test
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            python -m ownerplot.github_runner smoke
          else
            python -m ownerplot.github_runner commands
          fi
      - name: Save Telegram offset
        run: |
          if git diff --quiet -- data/state.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git commit -m "chore: update Telegram command offset"
          git pull --rebase
          git push

[project]
name = "ownerplot-finder"
version = "0.1.0"
description = "Telegram-first public owner plot discovery"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.13,<4",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.29,<1",
  "PyYAML>=6,<7",
  "cryptography>=43,<47",
  "Pillow>=11,<13",
  "pytesseract>=0.3.13,<1",
  "uvicorn[standard]>=0.30,<1"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ownerplot"]
